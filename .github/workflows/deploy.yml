name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; don't cancel in-flight deploys so
# the live site is never left half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-rust

      - name: Install wasm-pack
        # Use the official prebuilt installer rather than `cargo install`
        # — the latter recompiles wasm-pack from source on every run
        # (~1-2 min even with cached deps); the prebuilt binary downloads
        # in seconds.
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - run: pnpm install --frozen-lockfile

      - name: Build (with /jamiecam/ base path)
        run: pnpm build
        env:
          BASE_PATH: /jamiecam/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
