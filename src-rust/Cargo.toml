[package]
name = "jamiecam"
version = "0.1.0"
description = "JamieCam — CNC CAM web application (Rust → WebAssembly core)"
edition = "2021"
rust-version = "1.77"

[lib]
name = "jamiecam_lib"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = { version = "0.1", optional = true }

[features]
default = ["console_error_panic_hook"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
